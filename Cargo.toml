[package]
name = "stormwing"
version = "0.1.0"
edition = "2024"
description = "A vertical-scrolling arcade shoot-'em-up built with Bevy"

[dependencies]
bevy = { version = "0.20", features = ["wav"] }

# The web build renders with WebGPU (browsers without it aren't supported),
# and uses a few browser APIs (saves, sound, touch detection, random seed).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20", features = ["webgpu"] }
web-sys = { version = "0.3", features = [
    "Window",
    "MediaQueryList",
    "Storage",
    "AudioContext",
    "AudioContextState",
    "BaseAudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioScheduledSourceNode",
    "AudioNode",
    "AudioParam",
    "GainNode",
    "AudioDestinationNode",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[features]
# `cargo run --features dev` links Bevy dynamically for much faster rebuilds.
dev = ["bevy/dynamic_linking"]

# Keep our own crate quick to compile but optimise dependencies heavily,
# otherwise Bevy runs very slowly in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Web build: optimise for size, the browser downloads the whole binary.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"
strip = true
