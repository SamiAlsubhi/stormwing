[package]
name = "stormwing"
version = "0.1.0"
edition = "2024"
description = "A vertical-scrolling arcade shoot-'em-up built with Bevy"

[dependencies]
bevy = { version = "0.20", features = ["wav"] }

# Browser APIs for the web build (saves, touch detection, random seed).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "MediaQueryList", "Storage"] }
js-sys = "0.3"

[features]
# `cargo run --features dev` links Bevy dynamically for much faster rebuilds.
dev = ["bevy/dynamic_linking"]

# Keep our own crate quick to compile but optimise dependencies heavily,
# otherwise Bevy runs very slowly in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Web build: optimise for size, the browser downloads the whole binary.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"
strip = true
