<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04080f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Stormwing: a vertical-scrolling arcade shoot-'em-up built with Bevy.">
  <title>Stormwing</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #04080f;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stormwing {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      outline: none;
      touch-action: none;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      box-sizing: border-box;
      color: #bfe3ff;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      text-align: center;
      background: radial-gradient(ellipse at 50% 40%, #0d3552 0%, #04080f 70%);
    }
    #overlay h1 {
      margin: 0;
      font-size: clamp(40px, 13vw, 76px);
      letter-spacing: 0.06em;
      color: #ffd95a;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.5);
    }
    #overlay .tag { margin: -10px 0 8px; color: #73d0ff; letter-spacing: 0.2em; font-size: 14px; }
    #bar { width: min(320px, 70vw); height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
    #fill { width: 0; height: 100%; background: #73d0ff; transition: width 0.15s; }
    #status { min-height: 1.2em; font-size: 14px; color: rgba(255, 255, 255, 0.7); }
    #play {
      font: inherit;
      font-size: 22px;
      color: #fff;
      background: #14324f;
      border: 2px solid #73d0ff;
      border-radius: 12px;
      padding: 14px 40px;
      cursor: pointer;
    }
    #play:hover { background: #1d4a73; }
    #play[hidden] { display: none; }
    #help { max-width: 440px; font-size: 13px; line-height: 1.6; color: rgba(255, 255, 255, 0.5); }
  </style>
</head>
<body>
  <canvas id="stormwing" tabindex="0"></canvas>
  <div id="overlay">
    <h1>STORMWING</h1>
    <div class="tag">ARCADE SKY COMBAT</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="status">Loading...</div>
    <button id="play" hidden>Tap to play</button>
    <div id="help">
      Touch: drag one finger to fly, lift it to pause, tap a second finger to bomb.<br>
      Keyboard: WASD / arrows to fly, Space to bomb, Esc to pause, M to mute.
    </div>
  </div>
  <script type="module">
    import init from './stormwing.js';

    const overlay = document.getElementById('overlay');
    const fill = document.getElementById('fill');
    const status = document.getElementById('status');
    const play = document.getElementById('play');
    const canvas = document.getElementById('stormwing');

    // Download and compile the game first, then wait for a tap: browsers only
    // let a page start audio in response to a user gesture.
    async function load() {
      const response = await fetch('./stormwing_bg.wasm');
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const total = Number(response.headers.get('content-length')) || 0;
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        const mb = (received / 1048576).toFixed(1);
        status.textContent = `Loading... ${mb} MB`;
        if (total) fill.style.width = `${Math.min(100, (received / total) * 100)}%`;
      }
      fill.style.width = '100%';
      status.textContent = 'Preparing...';
      const bytes = new Uint8Array(received);
      let offset = 0;
      for (const chunk of chunks) {
        bytes.set(chunk, offset);
        offset += chunk.length;
      }
      return WebAssembly.compile(bytes);
    }

    try {
      const module = await load();
      status.textContent = '';
      play.hidden = false;
      play.addEventListener('click', async () => {
        overlay.remove();
        canvas.focus();
        try {
          await init({ module_or_path: module });
        } catch (e) {
          // winit stops the event loop by throwing; that one is expected.
          if (!String(e).includes('Using exceptions for control flow')) throw e;
        }
      }, { once: true });
    } catch (e) {
      status.textContent = `Could not load the game: ${e}`;
      console.error(e);
    }
  </script>
</body>
</html>
