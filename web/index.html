<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04080f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Stormwing: a vertical-scrolling arcade shoot-'em-up built with Bevy.">
  <title>Stormwing</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #04080f;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stormwing {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      outline: none;
      touch-action: none;
    }
    #overlay {
      transition: opacity 0.6s;
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      box-sizing: border-box;
      color: #bfe3ff;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      text-align: center;
      background: radial-gradient(ellipse at 50% 40%, #0d3552 0%, #04080f 70%);
    }
    #overlay h1 {
      margin: 0;
      font-size: clamp(40px, 13vw, 76px);
      letter-spacing: 0.06em;
      color: #ffd95a;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.5);
    }
    #overlay .tag { margin: -10px 0 8px; color: #73d0ff; letter-spacing: 0.2em; font-size: 14px; }
    #bar { width: min(320px, 70vw); height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
    #fill { width: 0; height: 100%; background: #73d0ff; transition: width 0.15s; }
    #status { min-height: 1.2em; font-size: 14px; color: rgba(255, 255, 255, 0.7); }
    #help { max-width: 440px; font-size: 13px; line-height: 1.6; color: rgba(255, 255, 255, 0.5); }
    #errors {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      max-height: 40vh;
      overflow: auto;
      padding: 10px;
      border-radius: 8px;
      background: rgba(60, 0, 0, 0.88);
      color: #ffd2d2;
      font: 11px/1.4 ui-monospace, Menlo, monospace;
      white-space: pre-wrap;
      z-index: 10;
    }
    #errors[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="stormwing" tabindex="0"></canvas>
  <div id="errors" hidden></div>
  <div id="overlay">
    <h1>STORMWING</h1>
    <div class="tag">ARCADE SKY COMBAT</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="status">Loading...</div>
    <div id="help">
      Touch: drag one finger to fly, lift it to pause, tap a second finger to bomb.<br>
      Keyboard: WASD / arrows to fly, Space to bomb, Esc to pause, M to mute.
    </div>
  </div>
  <script>
    // Show errors on screen, so problems on phones can be reported.
    (() => {
      const box = () => document.getElementById('errors');
      const show = (msg) => {
        const text = String(msg);
        // winit stops the event loop by throwing; that one is expected.
        if (text.includes('Using exceptions for control flow')) return;
        const el = box();
        if (!el) return;
        el.hidden = false;
        el.textContent += text.slice(0, 1500) + '\n\n';
      };
      const original = console.error.bind(console);
      console.error = (...args) => { original(...args); show(args.map(String).join(' ')); };
      window.addEventListener('error', (e) => show(e.message || e.error));
      window.addEventListener('unhandledrejection', (e) => show(e.reason));
    })();
  </script>
  <script type="module">
    // Each build has uniquely named files; version.json (never cached) says
    // which ones belong together.
    const { build } = await (await fetch(`./version.json?t=${Date.now()}`, { cache: 'no-store' })).json();
    const { default: init } = await import(`./stormwing-${build}.js`);

    // Phones only let a page start audio from inside a touch, click or key
    // press. So the game's AudioContext is created right here, on the first
    // gesture, and the game (audio.rs) plays its sounds through it.
    let audio = null;
    let speechUnlocked = false;
    const unlockAudio = () => {
      if (document.hidden) return;
      if (!audio) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          audio = new AC();
          window.stormwingAudio = audio;
          // iOS: a tiny silent sound inside the gesture fully wakes audio up.
          const silence = audio.createBuffer(1, 1, 22050);
          const src = audio.createBufferSource();
          src.buffer = silence;
          src.connect(audio.destination);
          src.start(0);
        }
      }
      if (audio && audio.state !== 'running') audio.resume().catch(() => {});
      // iOS only allows speech after it has been started from a gesture once.
      if (!speechUnlocked && window.speechSynthesis) {
        speechUnlocked = true;
        try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (_) {}
      }
    };
    for (const type of ['touchend', 'pointerup', 'mouseup', 'click', 'keydown']) {
      document.addEventListener(type, unlockAudio, { capture: true, passive: true });
    }
    // Silence everything while the page is in the background.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (audio) audio.suspend().catch(() => {});
        if (window.speechSynthesis) speechSynthesis.cancel();
      } else if (audio) {
        audio.resume().catch(() => {});
      }
    });
    // iOS: play through the media channel so the silent switch doesn't mute it.
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
    } catch (_) {}

    const overlay = document.getElementById('overlay');
    const fill = document.getElementById('fill');
    const status = document.getElementById('status');
    const canvas = document.getElementById('stormwing');

    // Download and compile the game first, then wait for a tap: browsers only
    // let a page start audio in response to a user gesture.
    async function load() {
      const response = await fetch(`./stormwing-${build}.wasm`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const total = Number(response.headers.get('content-length')) || 0;
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        const mb = (received / 1048576).toFixed(1);
        status.textContent = `Loading... ${mb} MB`;
        if (total) fill.style.width = `${Math.min(100, (received / total) * 100)}%`;
      }
      fill.style.width = '100%';
      status.textContent = 'Preparing...';
      const bytes = new Uint8Array(received);
      let offset = 0;
      for (const chunk of chunks) {
        bytes.set(chunk, offset);
        offset += chunk.length;
      }
      return WebAssembly.compile(bytes);
    }

    try {
      const module = await load();
      status.textContent = 'Preparing graphics...';
      // Keep this screen up until the game has drawn its first frames (phones
      // can take a while to compile the 3D shaders), then go straight in.
      // Sound starts on the first touch or key press, as browsers require.
      let shown = false;
      const reveal = () => {
        if (shown) return;
        shown = true;
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 700);
      };
      window.stormwingReady = reveal;
      setTimeout(reveal, 45000);
      canvas.focus();
      try {
        await init({ module_or_path: module });
      } catch (e) {
        // winit stops the event loop by throwing; that one is expected.
        if (!String(e).includes('Using exceptions for control flow')) throw e;
      }
    } catch (e) {
      status.textContent = `Could not load the game: ${e}`;
      console.error(e);
    }
  </script>
</body>
</html>
